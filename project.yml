name: MagicBoxie
options:
  bundleIdPrefix: com.magicboxie
  deploymentTarget:
    iOS: "16.0"
targets:
  MagicBoxie:
    type: application
    platform: iOS
    sources:
      - path: Sources/MagicBoxie
      - path: Sources/Shared
    dependencies:
      - target: MagicBoxieShareExtension
        embed: true
    info:
      path: Sources/MagicBoxie/Info.plist
      properties:
        CFBundleVersion: "6"
        UILaunchStoryboardName: LaunchScreen
        NSBluetoothAlwaysUsageDescription: "MagicBoxie uses Bluetooth to find and control your MagicBoxie player."
        NSBonjourServices:
          - _magicboxie._tcp
        NSLocalNetworkUsageDescription: "MagicBoxie uses your local network to find your MagicBoxie player over WiFi."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # So the Share Extension can hand a shared video off to the main app
        # (extensions can't do the upload themselves - see ShareViewController).
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - magicboxie
    entitlements:
      path: Sources/MagicBoxie/MagicBoxie.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.magicboxie.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexv.magicboxie.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # App Groups (needed for the Share Extension hand-off) isn't honored
        # under ad-hoc "Sign to Run Locally" - Xcode silently drops any
        # entitlement that needs a real provisioning profile. A free personal
        # team is enough to fix this, even for Simulator-only builds.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K2F4FTM2XQ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MagicBoxieShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/MagicBoxieShareExtension
      - path: Sources/Shared
    info:
      path: Sources/MagicBoxieShareExtension/Info.plist
      properties:
        CFBundleDisplayName: MagicBoxie
        CFBundleVersion: "6"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsMovieWithMaxCount: 1
    entitlements:
      path: Sources/MagicBoxieShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.magicboxie.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexv.magicboxie.app.ShareExtension
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K2F4FTM2XQ

schemes:
  MagicBoxie:
    build:
      targets:
        MagicBoxie: all
    run:
      config: Debug
      # Dev mode by default when running from Xcode: talks to the device's
      # HTTP API directly (e.g. the Docker container's web_service on this
      # Mac) instead of Bluetooth, so the UI can be built/tested without BLE
      # hardware or a Pi. Remove/flip to "0" in the scheme editor to test real
      # BLE. MAGICBOXIE_DEVICE_URL defaults to localhost:8000 if unset - point
      # it at a real device's LAN IP instead when needed.
      environmentVariables:
        MAGICBOXIE_DIRECT_API: "1"
        MAGICBOXIE_DEVICE_URL: "http://localhost:8000"
